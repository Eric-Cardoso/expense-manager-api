[project]
name = 'expense-manager-api'
version = '0.1.0'
requires-python = '>=3.12'
description = '''
API para gerenciamento de gastos mensais, com processamento de CSV,
cálculo automático de dívidas e relatórios.
'''
authors = [
    {name = 'Eric', email = 'ericcardoso454@gmail.com'}
]

[tool.taskipy.tasks]
run = 'python3 app.py'

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88