services:
  db:
    image: ${MYSQL_IMAGE}
    container_name: ${CONTAINER_DATABASE_NAME}
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
  
  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: ${CONTAINER_RABBITMQ_NAME}
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - '${RABBITMQ_PORT_INTERFACE}:${RABBITMQ_PORT_INTERFACE}'
      - '${RABBITMQ_PORT_AMQP}:${RABBITMQ_PORT_AMQP}'
  
  api:
    build: .
    container_name: ${CONTAINER_API_NAME}
    restart: always
    command: sh -c 'python3 -m app.app'
    ports:
      - '${API_PORT}:${API_PORT}'
    volumes:
      - '.:/app'
    depends_on:
      - db
      - rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    

  celery:
    build: .
    container_name: ${CONTAINER_CELERY_NAME}
    command: sh -c 'celery -A app.celery worker --loglevel=info'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - '.:/app'
    depends_on:
      - db
      - rabbitmq

volumes:
  mysql_data: